<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca especializada - Acesso</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #e1e3e6;
    --text-primary: #1e2024;
    --text-secondary: #6e747c;
    --text-muted: #969ba2;
    --accent: #4f46e5;
    --accent-bg: #ededfb;
    --on-accent: #ffffff;
    --field-bg: #fafafb;
    --radius: 8px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem;
    min-height: 100vh;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 1.5rem;
  }

  .brand svg {
    width: 24px;
    height: 24px;
    stroke: var(--accent);
  }

  .brand span {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  /* ---- Tab switching (CSS only, no JS) ---- */
  .auth-wrapper {
    width: 100%;
    max-width: 360px;
  }

  .auth-wrapper input[type="radio"] {
    display: none;
  }

  .card {
    display: none;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.75rem 1.5rem;
    flex-direction: column;
    gap: 1.1rem;
  }

  #tab-login:checked ~ .screens #screen-login,
  #tab-signup:checked ~ .screens #screen-signup,
  #tab-forgot:checked ~ .screens #screen-forgot,
  #tab-matricula:checked ~ .screens #screen-matricula {
    display: flex;
  }

  .screen-header {
    text-align: center;
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 4px;
  }

  .screen-header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }

  .screen-header p {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
  }

  .field {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--field-bg);
    border-radius: var(--radius);
    padding: 0 12px;
    height: 42px;
  }

  .field svg {
    width: 16px;
    height: 16px;
    stroke: var(--text-muted);
    flex-shrink: 0;
  }

  .field input {
    border: none;
    outline: none;
    background: transparent;
    font-size: 14px;
    width: 100%;
    color: var(--text-primary);
    font-family: inherit;
  }

  .field input::placeholder {
    color: var(--text-muted);
  }

  .btn {
    height: 42px;
    border-radius: var(--radius);
    border: none;
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
  }

  .btn svg {
    width: 16px;
    height: 16px;
  }

  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
  }

  .btn-primary:hover {
    background: #4338ca;
  }

  .btn-secondary {
    background: transparent;
    border: 1px solid #c4c7cd;
    color: var(--text-primary);
  }

  .btn-secondary:hover {
    background: #f6f6f7;
  }

  .link-btn {
    background: none;
    border: none;
    padding: 0;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    text-decoration: none;
    display: block;
  }

  .link-btn:hover {
    text-decoration: underline;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-muted);
    font-size: 12px;
  }

  .divider::before,
  .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .footnote {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
  }

  .icon-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--accent-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 4px;
  }

  .icon-circle svg {
    width: 20px;
    height: 20px;
    stroke: var(--accent);
  }
</style>
</head>
<body>

  <div class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <span>Busca especializada</span>
  </div>

  <div class="auth-wrapper">

    <!-- Controles de navegação entre telas (somente CSS, via :checked) -->
    <input type="radio" name="tab" id="tab-login" checked>
    <input type="radio" name="tab" id="tab-signup">
    <input type="radio" name="tab" id="tab-forgot">
    <input type="radio" name="tab" id="tab-matricula">

    <div class="screens">

      <!-- TELA 1: LOGIN -->
      <section class="card" id="screen-login">
        <div class="screen-header">
          <h1>Entrar</h1>
          <p>Acesse sua conta para continuar</p>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
          <input type="text" placeholder="E-mail ou usuário">
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input type="password" placeholder="Senha">
        </div>

        <button type="button" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Entrar
        </button>

        <label for="tab-forgot" class="link-btn">Esqueceu a senha?</label>

        <div class="divider">ou</div>

        <label for="tab-matricula" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><line x1="15" y1="10" x2="18" y2="10"></line><line x1="15" y1="14" x2="18" y2="14"></line></svg>
          Entrar com matrícula Unifor
        </label>

        <p class="footnote">Não tem conta? <label for="tab-signup" class="link-btn" style="display:inline">Criar conta</label></p>
      </section>

      <!-- TELA 2: CRIAR CONTA -->
      <section class="card" id="screen-signup">
        <div class="screen-header">
          <h1>Criar conta</h1>
          <p>Preencha os dados para se cadastrar</p>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" placeholder="Nome completo">
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
          <input type="text" placeholder="E-mail">
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input type="password" placeholder="Criar senha">
        </div>

        <button type="button" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="17" y1="11" x2="23" y2="11"></line></svg>
          Criar minha conta
        </button>

        <p class="footnote">Já tem conta? <label for="tab-login" class="link-btn" style="display:inline">Entrar</label></p>
      </section>

      <!-- TELA 3: ESQUECEU A SENHA -->
      <section class="card" id="screen-forgot">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><line x1="12" y1="14" x2="12" y2="16"></line></svg>
        </div>
        <div class="screen-header">
          <h1>Esqueceu a senha?</h1>
          <p>Informe seu e-mail para receber o link de redefinição</p>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="M2 7l10 6 10-6"></path></svg>
          <input type="text" placeholder="E-mail cadastrado">
        </div>

        <button type="button" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          Enviar link de redefinição
        </button>

        <label for="tab-login" class="link-btn">Voltar para o login</label>
      </section>

      <!-- TELA 4: ENTRAR COM MATRÍCULA UNIFOR -->
      <section class="card" id="screen-matricula">
        <div class="icon-circle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><line x1="15" y1="10" x2="18" y2="10"></line><line x1="15" y1="14" x2="18" y2="14"></line></svg>
        </div>
        <div class="screen-header">
          <h1>Entrar com matrícula Unifor</h1>
          <p>Use sua matrícula e senha institucional</p>
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="12" r="2"></circle><line x1="15" y1="10" x2="18" y2="10"></line><line x1="15" y1="14" x2="18" y2="14"></line></svg>
          <input type="text" placeholder="Matrícula Unifor">
        </div>

        <div class="field">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
          <input type="password" placeholder="Senha">
        </div>

        <button type="button" class="btn btn-primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          Entrar
        </button>

        <label for="tab-login" class="link-btn">Voltar para o login</label>
      </section>

    </div>
  </div>

</body>
</html>
